name: Erinnerungen senden
on:
  schedule:
    - cron: '13 * * * *'   # stündlich – damit Duell-Herausforderungen zeitnah ankommen
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    if: ${{ vars.PUSH_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install google-auth requests
      - run: python tools/send_push.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
